<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album | HARIKZ</title>
<meta name="description" content="HARIKZ Travel Photo Album.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,700&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="album.css">
</head>
<body class="album-page">

<!-- LIVING TRAVEL SKY -->
<div id="sky"></div>
<div id="stars"></div>
<div id="sun"></div>
<div id="moon"></div>
<div id="clouds"><i></i><i></i><i></i></div>
<div id="flies" aria-hidden="true"></div>
<div id="progress"></div>

<!-- MINIMAL TOP BAR -->
<header class="top">
  <a href="../" class="logo">HARIKZ<small>album</small></a>
  <a class="navpill" href="../">← Back</a>
</header>

<!-- DRIVING ROAD SCENE -->
<div class="scene" aria-hidden="true">
  <div class="layer l1" id="l1"><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 200V110C120 50 220 90 340 100S560 30 700 70 960 130 1060 80 1160 70 1200 110V200Z"/></svg><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 200V110C120 50 220 90 340 100S560 30 700 70 960 130 1060 80 1160 70 1200 110V200Z"/></svg></div>
  <div class="layer l2" id="l2"><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 200V130C140 90 260 150 400 120S640 70 780 110 1040 160 1130 120 1180 120 1200 130V200Z"/></svg><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 200V130C140 90 260 150 400 120S640 70 780 110 1040 160 1130 120 1180 120 1200 130V200Z"/></svg></div>
  <div class="layer l3" id="l3"><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 200V150C100 120 240 170 380 150S620 120 760 150 1000 180 1100 150 1180 140 1200 150V200Z"/></svg><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 200V150C100 120 240 170 380 150S620 120 760 150 1000 180 1100 150 1180 140 1200 150V200Z"/></svg></div>
  <div class="road" id="road"></div>
  <div class="van" id="van">
    <div class="beam" id="beam"></div>
    <div class="lamp-glow" id="lamp"></div>
    <div class="road-light" id="roadlight"></div>
    <div class="puffs"><i></i><i></i><i></i></div>
    <canvas id="vanimg" width="1" height="1" role="img" aria-label="HARIKZ Force Traveller"></canvas>
    <div class="rim" id="w1" style="left:24.6%;top:82.4%"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#b9bdc2"/><circle cx="50" cy="50" r="40" fill="#8f949a"/><g fill="#2a2d31"><circle cx="50" cy="50" r="12"/><circle cx="50" cy="26" r="5"/><circle cx="73" cy="43" r="5"/><circle cx="64" cy="70" r="5"/><circle cx="36" cy="70" r="5"/><circle cx="27" cy="43" r="5"/></g></svg></div>
    <div class="rim" id="w2" style="left:82.2%;top:82%"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#b9bdc2"/><circle cx="50" cy="50" r="40" fill="#8f949a"/><g fill="#2a2d31"><circle cx="50" cy="50" r="12"/><circle cx="50" cy="26" r="5"/><circle cx="73" cy="43" r="5"/><circle cx="64" cy="70" r="5"/><circle cx="36" cy="70" r="5"/><circle cx="27" cy="43" r="5"/></g></svg></div>
  </div>
</div>

<main class="pure-album">
  <!-- TOUCH-SWIPE PHOTO STACK -->
  <section class="stack-sec" aria-label="Swipeable travel photo deck">
    <div class="stack-stage" id="stack-stage"></div>
    <div class="stack-bar">
      <button type="button" class="s-btn" id="s-prev" aria-label="Previous photo">‹</button>
      <span class="s-count" id="s-count">01 / 06</span>
      <button type="button" class="s-btn" id="s-next" aria-label="Next photo">›</button>
      <button type="button" class="s-play" id="s-play" aria-label="Play photo slideshow">▶</button>
    </div>
  </section>

  <!-- PURE 6-PHOTO GALLERY -->
  <section class="photo-grid" id="photo-grid" aria-label="All travel photos"></section>
</main>

<!-- MINIMAL FULLSCREEN PHOTO LIGHTBOX -->
<div class="lb" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <div class="lb-backdrop" id="lb-backdrop"></div>
  <div class="lb-shell">
    <div class="lb-top">
      <span class="lb-count" id="lb-count">01 / 06</span>
      <div class="lb-controls">
        <button type="button" class="lb-icon" id="lb-play" aria-label="Play slideshow">▶</button>
        <button type="button" class="lb-icon" id="lb-close" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="lb-bar" aria-hidden="true"><div class="lb-bar-fill" id="lb-timer"></div></div>
    <div class="lb-stage" id="lb-stage">
      <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="Previous photo">‹</button>
      <div class="lb-frame" id="lb-frame">
        <img id="lb-img" src="" alt="HARIKZ travel photo" class="lb-img">
      </div>
      <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="Next photo">›</button>
    </div>
    <div class="lb-strip" id="lb-strip" aria-label="Thumbnails"></div>
  </div>
</div>

<script src="album.js"></script>
</body>
</html>
