<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album | HARIKZ</title>
<meta name="description" content="HARIKZ Travel Photo Album — postcards from the road.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,700&family=DM+Sans:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="album.css">
</head>
<body class="album-page">

<!-- LIVING SKY -->
<div id="sky"></div>
<div id="stars"></div>
<div id="sun"></div>
<div id="moon"></div>
<div id="clouds"><i></i><i></i><i></i></div>
<div id="flyers" aria-hidden="true">
  <div class="bird b1">⌣⌣</div><div class="bird b2">⌣⌣</div><div class="bird b3">⌣⌣</div>
  <div class="plane">✈<span></span></div>
  <div class="balloon"><i></i><b></b></div>
</div>
<div id="flies" aria-hidden="true"></div>
<div id="progress"></div>

<!-- TOP BAR -->
<header class="top">
  <a href="../" class="logo">HARIKZ<small>album</small></a>
  <a class="navpill" href="../">← Back</a>
</header>

<!-- DRIVING ROAD SCENE -->
<div class="scene" aria-hidden="true">
  <div class="layer l1" id="l1"><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 200V110C120 50 220 90 340 100S560 30 700 70 960 130 1060 80 1160 70 1200 110V200Z"/></svg><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 200V110C120 50 220 90 340 100S560 30 700 70 960 130 1060 80 1160 70 1200 110V200Z"/></svg></div>
  <div class="layer l2" id="l2"><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 200V130C140 90 260 150 400 120S640 70 780 110 1040 160 1130 120 1180 120 1200 130V200Z"/></svg><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 200V130C140 90 260 150 400 120S640 70 780 110 1040 160 1130 120 1180 120 1200 130V200Z"/></svg></div>
  <div class="layer l3" id="l3"><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 200V150C100 120 240 170 380 150S620 120 760 150 1000 180 1100 150 1180 140 1200 150V200Z"/></svg><svg viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 200V150C100 120 240 170 380 150S620 120 760 150 1000 180 1100 150 1180 140 1200 150V200Z"/></svg></div>
  <div class="road" id="road"></div>
  <div class="van" id="van">
    <div class="beam" id="beam"></div>
    <div class="lamp-glow" id="lamp"></div>
    <div class="road-light" id="roadlight"></div>
    <div class="puffs"><i></i><i></i><i></i></div>
    <canvas id="vanimg" width="1" height="1" role="img" aria-label="HARIKZ Force Traveller"></canvas>
    <div class="rim" id="w1" style="left:24.6%;top:82.4%"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#b9bdc2"/><circle cx="50" cy="50" r="40" fill="#8f949a"/><g fill="#2a2d31"><circle cx="50" cy="50" r="12"/><circle cx="50" cy="26" r="5"/><circle cx="73" cy="43" r="5"/><circle cx="64" cy="70" r="5"/><circle cx="36" cy="70" r="5"/><circle cx="27" cy="43" r="5"/></g></svg></div>
    <div class="rim" id="w2" style="left:82.2%;top:82%"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#b9bdc2"/><circle cx="50" cy="50" r="40" fill="#8f949a"/><g fill="#2a2d31"><circle cx="50" cy="50" r="12"/><circle cx="50" cy="26" r="5"/><circle cx="73" cy="43" r="5"/><circle cx="64" cy="70" r="5"/><circle cx="36" cy="70" r="5"/><circle cx="27" cy="43" r="5"/></g></svg></div>
  </div>
</div>

<!-- TAPED POLAROID ALBUM -->
<main class="album-wrap">
  <section class="stop cards album-sec" aria-label="HARIKZ Photo Album">
    <div class="pcs">
      <figure class="pc album-pc rv" data-index="0" style="--r:-2.5deg">
        <span class="tape"></span>
        <div class="pcf-photo">
          <img src="photos/harikz-travel-hub-poster.jpg?v=ai2" alt="HARIKZ Travel Hub scenic highway" loading="eager">
          <span class="p-sheen" aria-hidden="true"></span>
        </div>
        <figcaption>enjoy the ride ✦ <button type="button" class="pc-open" data-open="0">view photo</button></figcaption>
      </figure>

      <figure class="pc album-pc rv" data-index="1" style="--r:2deg">
        <span class="tape"></span>
        <div class="pcf-photo">
          <img src="photos/forest-road-traveller.jpg?v=ai3" alt="HARIKZ Force Traveller coastal cliff sunset" loading="eager">
          <span class="p-sheen" aria-hidden="true"></span>
        </div>
        <figcaption>coastal sunset ✦ <button type="button" class="pc-open" data-open="1">view photo</button></figcaption>
      </figure>

      <figure class="pc album-pc rv" data-index="2" style="--r:-1.5deg">
        <span class="tape"></span>
        <div class="pcf-photo">
          <img src="photos/misty-hill-drive.jpg?v=ai2" alt="HARIKZ Tata Winger above misty dawn clouds" loading="lazy">
          <span class="p-sheen" aria-hidden="true"></span>
        </div>
        <figcaption>misty ghats ✦ <button type="button" class="pc-open" data-open="2">view photo</button></figcaption>
      </figure>

      <figure class="pc album-pc rv" data-index="3" style="--r:2.5deg">
        <span class="tape"></span>
        <div class="pcf-photo">
          <img src="photos/mountain-highway-stop.jpg?v=ai2" alt="HARIKZ Tata Winger mountain highway overlook" loading="lazy">
          <span class="p-sheen" aria-hidden="true"></span>
        </div>
        <figcaption>on the open road ✦ <button type="button" class="pc-open" data-open="3">view photo</button></figcaption>
      </figure>

      <figure class="pc album-pc rv" data-index="4" style="--r:-2deg">
        <span class="tape"></span>
        <div class="pcf-photo">
          <img src="photos/monsoon-pitstop-force.jpg?v=ai2" alt="HARIKZ Force Traveller twilight monsoon pit stop" loading="lazy">
          <span class="p-sheen" aria-hidden="true"></span>
        </div>
        <figcaption>monsoon miles ✦ <button type="button" class="pc-open" data-open="4">view photo</button></figcaption>
      </figure>

      <figure class="pc album-pc rv" data-index="5" style="--r:1.8deg">
        <span class="tape"></span>
        <div class="pcf-photo">
          <img src="photos/fleet-duo-ready.jpg?v=ai2" alt="HARIKZ Force Traveller and WagonR along Kerala backwaters" loading="lazy">
          <span class="p-sheen" aria-hidden="true"></span>
        </div>
        <figcaption>happy travellers ✦ <button type="button" class="pc-open" data-open="5">view photo</button></figcaption>
      </figure>
    </div>
  </section>
</main>

<!-- MINIMAL FULLSCREEN TOUCH-SWIPE VIEWER -->
<div class="lb" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <div class="lb-backdrop" id="lb-backdrop"></div>
  <div class="lb-shell">
    <div class="lb-top">
      <span class="lb-count" id="lb-count">01 / 06</span>
      <div class="lb-controls">
        <button type="button" class="lb-icon" id="lb-play" aria-label="Play slideshow">▶</button>
        <button type="button" class="lb-icon" id="lb-close" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="lb-bar" aria-hidden="true"><div class="lb-bar-fill" id="lb-timer"></div></div>
    <div class="lb-stage" id="lb-stage">
      <button type="button" class="lb-nav lb-prev" id="lb-prev" aria-label="Previous photo">‹</button>
      <div class="lb-frame" id="lb-frame">
        <img id="lb-img" src="" alt="HARIKZ travel photo" class="lb-img">
      </div>
      <button type="button" class="lb-nav lb-next" id="lb-next" aria-label="Next photo">›</button>
    </div>
    <div class="lb-strip" id="lb-strip" aria-label="Thumbnails"></div>
  </div>
</div>

<script src="album.js"></script>
</body>
</html>
